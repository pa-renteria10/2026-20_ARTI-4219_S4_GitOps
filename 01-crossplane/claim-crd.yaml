apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresqlinstances.database.poc.io
spec:
  group: database.poc.io
  scope: Namespaced
  names:
    plural: postgresqlinstances
    singular: postgresqlinstance
    kind: PostgreSQLInstance
    shortNames:
      - pginst
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                forProvider:
                  type: object
                  properties:
                    dbName:
                      type: string
                      description: "Nombre de la base de datos"
                    owner:
                      type: string
                      description: "Usuario propietario de la base de datos"
                writeConnectionSecretToRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
              required:
                - forProvider
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
